<!DOCTYPE html>
<html>
<head>
  <style>
    body { width: 350px; padding: 10px; font-family: system-ui; }
    textarea { width: 100%; height: 80px; margin: 10px 0; }
    button { padding: 8px 16px; margin: 5px; cursor: pointer; }
    .queue-item { padding: 8px; margin: 5px 0; border: 1px solid #ddd; border-radius: 4px; }
    .pending { background: #f0f0f0; }
    .sending { background: #fff3cd; }
    .sent { background: #d4edda; }
    .failed { background: #f8d7da; }
    .status { font-size: 12px; color: #666; }
  </style>
</head>
<body>
  <h3>Atlas Queue</h3>
  <textarea id="message" placeholder="Enter message to queue..."></textarea>
  <div>
    <button id="add">Add to Queue</button>
    <button id="start">Send All</button>
    <button id="clear">Clear</button>
  </div>
  <div id="queue"></div>
  <script src="popup.js"></script>
</body>
</html>
